<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demiurge</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06080c;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        font-family: monospace;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.75);
        pointer-events: none;
        white-space: pre-line;
        line-height: 1.6;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }

      /* Loading overlay — shown immediately (in markup) so the boot is never a black screen.
         The spinner is a CSS animation (runs on the compositor, so it keeps spinning even
         while the main thread is blocked baking the planet). main.ts updates the bar/text
         at load milestones and fades this out on the first rendered frame. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #06080c;
        font-family: monospace;
        color: rgba(255, 255, 255, 0.85);
        transition: opacity 0.5s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .spinner {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: rgba(120, 170, 255, 0.9);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #loading-text {
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      .loading-track {
        width: 220px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #loading-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4a7bff, #7fd0ff);
        transition: width 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="loading">
      <div class="loading-inner">
        <div class="spinner"></div>
        <div id="loading-text">Generating planet…</div>
        <div class="loading-track"><div id="loading-bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
